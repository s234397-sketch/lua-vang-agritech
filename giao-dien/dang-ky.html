<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/hinh-anh/logo-lua-vang.png">
    <title>Lúa Vàng - Đăng Ký Tài Khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/nang-cap-ui.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luaGreen: '#064e3b',
                        luaBgKem: '#f4f6ee',
                        luaAccent: '#10b981',
                        luaYellow: '#d97706'
                    }
                }
            }
        }
    </script>
    <script src="thong-bao-ui.js"></script>
</head>
<body class="bg-luaBgKem min-h-screen text-gray-800 font-sans">

    <!-- HEADER DÙNG CHUNG -->
    <header id="site-header" class="bg-white shadow-sm sticky top-0 z-50"></header>

    <!-- FORM ĐĂNG KÝ -->
    <main class="max-w-md mx-auto px-4 py-10">
        <div class="card-agritech p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 text-left mx-auto mb-4">
                    <img src="/hinh-anh/logo-lua-vang.png" alt="Lúa Vàng AgriTech" class="h-16 w-auto object-contain shrink-0">
                    <div class="flex flex-col">
                        <span class="text-xl font-extrabold text-[#12523a] tracking-tight leading-none">Lúa Vàng</span>
                        <span class="text-[10px] font-bold tracking-[0.24em] text-[#d97706] uppercase mt-1">AGRITECH</span>
                    </div>
                </div>
                <h1 class="text-2xl font-black text-luaGreen uppercase">ĐĂNG KÝ TÀI KHOẢN</h1>
                <p class="text-gray-500 text-sm mt-1">Tạo tài khoản để đặt dịch vụ và mua sắm dễ dàng</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và tên bà con</label>
                    <input type="text" id="fullname" required placeholder="Nhập họ và tên..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-luaGreen text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Số điện thoại</label>
                    <input type="text" id="phone" required placeholder="Nhập số điện thoại..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-luaGreen text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Địa chỉ (Xã / Huyện / Tỉnh)</label>
                    <input type="text" id="address" placeholder="Nhập địa chỉ nhận hàng/thuê máy..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-luaGreen text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu</label>
                    <input type="password" id="reg-password" required placeholder="Tạo mật khẩu..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-luaGreen text-sm">
                </div>

                <!-- CỤM MÃ CAPTCHA -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mã xác nhận (Captcha)</label>
                    <div class="flex items-center gap-3 mb-2">
                        <div id="captchaBox" class="bg-gray-100 font-bold text-xl tracking-widest px-4 py-2 rounded-xl select-none font-mono line-through text-emerald-800 border border-gray-200 flex-1 text-center">
                            <!-- Mã sinh ngẫu nhiên -->
                        </div>
                        <button type="button" onclick="generateCaptcha()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-3 rounded-xl transition text-sm" title="Đổi mã khác">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    <input type="text" id="captchaInput" required placeholder="Nhập lại các ký tự trong khung..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-luaGreen text-sm">
                </div>

                <button type="submit" class="w-full bg-luaGreen hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl transition shadow-md mt-2">
                    Tạo tài khoản ngay
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                Đã có tài khoản rồi? 
                <a href="/dang-nhap.html" class="text-luaGreen font-bold hover:underline">Đăng nhập tại đây</a>
            </div>
        </div>
    </main>

    <!-- SCRIPT LOGIC VÀ CAPTCHA -->
    <script>
        let currentCaptcha = '';

        // Hàm tạo mã captcha ngẫu nhiên 6 ký tự
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            currentCaptcha = '';
            for (let i = 0; i < 6; i++) {
                currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('captchaBox').innerText = currentCaptcha;
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Khởi tạo mã captcha khi tải trang
            generateCaptcha();

            // Load header
            fetch('/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('site-header').innerHTML = data;
                });

            // Xử lý gửi form đăng ký xuống Backend kết nối SQL Server
            document.getElementById('register-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const userInput = document.getElementById('captchaInput').value.trim();
                
                // Kiểm tra mã captcha khớp hay không
                if (userInput !== currentCaptcha) {
                    alert('❌ Mã xác nhận (Captcha) chưa chính xác. Vui lòng nhập lại!');
                    generateCaptcha();
                    document.getElementById('captchaInput').value = '';
                    document.getElementById('captchaInput').focus();
                    return;
                }

                const fullname = document.getElementById('fullname').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const password = document.getElementById('reg-password').value;

                try {
                    // Gửi request POST xuống API backend Node.js
                    const response = await fetch('/api/dang-ky', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullname, phone, address, password })
                    });

                    const result = await response.json();

                    if (result.success) {
                        await hienThongBao('✅ Đăng ký thành công! Dữ liệu đã được lưu vào CSDL LuaVangDB.');
                        
                        // Lưu thông tin vào localStorage để hiển thị lên header
                        localStorage.setItem('luaVangUser', JSON.stringify({
                            name: fullname,
                            phone: phone,
                            role: 'nong-dan'
                        }));

                        window.location.href = '/trang-chu.html';
                    } else {
                        alert('❌ ' + result.message);
                        generateCaptcha();
                        document.getElementById('captchaInput').value = '';
                    }
                } catch (err) {
                    console.error('Lỗi kết nối:', err);
                    alert('❌ Không thể kết nối tới server!');
                }
            });
        });
    </script>
</body>
</html>
